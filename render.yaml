services:
  - type: web
    name: glasspire
    runtime: static
    rootDir: .
    buildCommand: node scripts/build-static.cjs
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /favicon.png
        name: Cache-Control
        value: public, max-age=86400
